name: Publish

# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere.
# The trusted publisher configured on npmjs.com must match exactly:
#   repository: touchifyapp/svelte-local-query, workflow: publish.yml, environment: npm
# See RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token npm exchanges for a publish credential
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm >= 11.5.1
      - name: Ensure a recent npm
        run: |
          if ! npx -y semver@7 -r '>=11.5.1' "$(npm --version)" > /dev/null; then
            npm install -g npm@11
          fi
          npm --version

      - name: Check the release tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
          # prereleases (e.g. 0.2.0-next.1) go to the `next` dist-tag, never `latest`
          if [[ "${version}" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # provenance is generated automatically with trusted publishing
      - name: Publish
        run: npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"
